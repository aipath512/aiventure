<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIO-21 Audit | AiVenture</title><style>body{background:#090b10;color:#f3f4f6;font:15px system-ui;margin:0}main{max-width:1150px;margin:auto;padding:30px 18px}h1{font-size:2.5rem}p{color:#bac2d0}input{width:min(650px,75%);padding:13px;background:#1b2130;color:white;border:1px solid #465068;border-radius:8px}button{padding:12px;background:#e0bc5d;color:#111;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse;background:#151a24}td,th{border-bottom:1px solid #333c4b;text-align:left;padding:12px}th{color:#e0bc5d} .pill{border-radius:20px;padding:5px 10px;font-weight:bold}.PASS{background:#135b35}.PARTIAL{background:#73540d}.FAIL{background:#812727}.UNKNOWN{background:#424b5d}.scroll{overflow:auto} .cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:15px;background:#202838;border-radius:10px}a{color:#e0bc5d}</style></head><body><main><a href="/aio/">← AIO AiVenture</a><h1>AIO-21 · Audit comparativ</h1><p>21 semnale AIO · BEFORE / AFTER · evidențe · statut verificabil. Niciun PASS nu este atribuit fără verificare.</p><form id="f"><input id="url" type="url" value="https://aiventure.ro/" required aria-label="URL de auditat"><button>Auditează</button></form><p id="message">Introduceți URL-ul pentru un audit structural orientativ. Nu reprezintă certificare semantică.</p><div class="cards" id="counts"></div><div class="scroll"><table><thead><tr><th>ID</th><th>Semnal AIO</th><th>BEFORE</th><th>AFTER</th><th>Evidență</th></tr></thead><tbody id="rows"></tbody></table></div><p><button id="download">Descarcă raport JSON</button></p></main><script>
const names=["LLM-readable summary","Canonical direct answers","Citable answer chunks","RAG chunk boundaries","Chunk provenance","Semantic keyword clusters","Concept cluster coverage","Definition ownership","Intent mapping TOF/MOF/BOF","Question-answer alignment","Long-form completeness","Content hierarchy H1–H3","Internal semantic links","Entity disambiguation","Cross-page consistency","Freshness metadata","Chronological versioning","Unique data attribution","Methodology disclosure","Negative scope","Machine-readable resource links"];
let report={url:"",checked_at:null,signals:names.map((name,i)=>({id:"AIO-"+String(i+1).padStart(2,"0"),name,before:"UNKNOWN",after:"UNKNOWN",evidence:"Audit neexecutat"}))};
function render(){document.getElementById("rows").innerHTML=report.signals.map(s=>'<tr><td>'+s.id+'</td><td>'+s.name+'</td><td><span class="pill '+s.before+'">'+s.before+'</span></td><td><span class="pill '+s.after+'">'+s.after+'</span></td><td>'+s.evidence.replaceAll("&","&amp;").replaceAll("<","&lt;")+'</td></tr>').join("");document.getElementById("counts").innerHTML=["PASS","PARTIAL","FAIL","UNKNOWN"].map(x=>'<div class="card">'+x+': '+report.signals.filter(s=>s.before===x).length+'</div>').join("")}
render();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const url=document.getElementById("url").value;document.getElementById("message").textContent="Se execută auditul…";try{const r=await fetch("/api/aio-21-audit?url="+encodeURIComponent(url));if(!r.ok)throw Error("HTTP "+r.status);report=await r.json();document.getElementById("message").textContent="Audit executat: "+report.checked_at;render()}catch(err){document.getElementById("message").textContent="Audit indisponibil: "+err.message;}}
document.getElementById("download").onclick=()=>{const a=document.createElement("a"),blob=new Blob([JSON.stringify(report,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="aio-21-report.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
