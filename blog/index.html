<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog · AiVenture Knowledge Base</title><meta name="description" content="AiVenture Knowledge Base: AI-LENS, AIO, GEO, AI Signals, WEB-OM, WEB-AI și WEB-A2A."><link rel="canonical" href="https://aiventure.ro/blog/"><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f5f5;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px 80px}a{color:#e7c86e;text-decoration:none}.crumb{font-size:13px;color:#999}h1{font-size:clamp(36px,8vw,64px);line-height:1;margin:30px 0 12px}.lead{max-width:760px;color:#c6c9d0}.search{position:sticky;top:0;background:#090b10;padding:18px 0 12px;z-index:3}input{width:100%;padding:16px 18px;font-size:18px;border-radius:14px;border:1px solid #343945;background:#11141b;color:white}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 20px}.filters button{white-space:nowrap;background:#11141b;color:#ddd;border:1px solid #343945;border-radius:999px;padding:8px 12px}.item{padding:20px 0;border-top:1px solid #282c35}.id{font:12px ui-monospace,monospace;color:#e7c86e}.item h2{font-size:21px;line-height:1.25;margin:5px 0}.meta,.count{font-size:13px;color:#999}</style></head><body><main><div class="crumb"><a href="/">AiVenture</a> / Blog</div><h1>AiVenture Knowledge Base</h1><p class="lead">Articole metodologice și tehnice despre Web-Om, Web-AI, Web-A2A, AI-LENS, AIO, GEO și AI Signals. Navigare clasică + căutare instant în aceeași bază de cunoștințe.</p><div class="search"><input id="q" type="search" placeholder="Caută articol, ID, AIO, GEO, Perplexity…"></div><div class="filters" id="filters"><button data-f="">Toate</button><button data-f="AI-LENS">AI-LENS</button><button data-f="AIO">AIO</button><button data-f="GEO">GEO</button><button data-f="AI Signals">AI Signals</button><button data-f="WEB">WEB</button></div><div id="count" class="count"></div><section id="list"></section><script>let data=[],f="";const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function init(){data=(await(await fetch("/blog/articles.json",{cache:"no-store"})).json()).articles;draw()}function draw(){let q=document.querySelector("#q").value.toLowerCase().trim(),r=data.filter(a=>{let h=(a.id+" "+a.title+" "+a.category).toLowerCase();return(!q||h.includes(q))&&(!f||h.includes(f.toLowerCase()))});document.querySelector("#count").textContent=r.length+" articole";document.querySelector("#list").innerHTML=r.map(a=>`<article class="item"><div class="id">${esc(a.id)}</div><h2><a href="/blog/${esc(a.slug)}/">${esc(a.title)}</a></h2><div class="meta">${esc(a.category)} · v${esc(a.version)}</div></article>`).join("")}document.querySelector("#q").oninput=draw;document.querySelector("#filters").onclick=e=>{if(e.target.dataset.f!==undefined){f=e.target.dataset.f;draw()}};init();</script></main></body></html>
